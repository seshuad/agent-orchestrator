        or {}).get(''invoice'')) or {}).get(''invoice_number'')) | tojson }}'
      amount: '{{ (((((((finish_check.output if finish_check is defined else none) or {}).get(''results'')) or {}).get(''invoice''))
        or {}).get(''total'')) | tojson }}'
      po_number: '{{ (((((finish_check.output if finish_check is defined else none) or {}).get(''results'')) or
        {}).get(''po_number'')) | tojson }}'
      outcome: '{{ (((((finish_check.output if finish_check is defined else none) or {}).get(''results'')) or {}).get(''outcome''))
        | tojson }}'
    dry_run: '{{ workflow.input.dry_run | tojson }}'
  routes:
