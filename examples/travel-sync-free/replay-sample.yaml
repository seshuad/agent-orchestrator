# Scripted planner and reader answers for travel-sync on the sample emails, so the whole workflow runs
# in Conductor without a model. Generated from the Tidy up operations, so the trip ids and booking keys
# below are the ones the real Tidy up computes. Includes one planner mistake (finishing before
# double-checking) the finishing rule must catch.
#
#   uv run agent-service run examples/travel-sync-free/travel-sync-free.agent.yaml \
#     --sample-data examples/travel-sync-free/sample-data --replay examples/travel-sync-free/replay-sample.yaml
