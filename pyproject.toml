[project]
name = "agent-service"
version = "0.1.0"
description = "Agent Orchestration Service prototype: agent format, compiler to Conductor YAML, and a local run environment."
requires-python = ">=3.13"
dependencies = [
    "cel-python>=0.4",
    "fastapi>=0.141.1",
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
    "mcp>=2.2.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
agent-service = "agent_service.cli:main"                   # compile and run agents
agent-service-gateway = "agent_service.runtime.gateway:main"   # stdio shim to the connector gateway
agent-service-steps = "agent_service.runtime.steps:main"       # Built-in step library
agent-service-cel = "agent_service.runtime.cel_server:main"    # CEL evaluator (MCP)
agent-service-replay = "agent_service.runtime.replay:main"   # scripted model steps, for tests

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
