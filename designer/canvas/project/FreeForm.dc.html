<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Step Designer — Resolve exception</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;background:#F1F1EE}
a{color:{{accent}}}
a:hover{color:#1F3E63}
::placeholder{color:#9A9A92}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #F1F1EE; color: #1F2430; overflow: hidden">

  <div style="height: 64px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: #FFFFFF; border-bottom: 1px solid #E3E3DD">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font-size: 13px; color: #6B6B63">Agent Service</span>
      <span style="font-size: 13px; color: #B7B7AC">/</span>
      <span style="font-size: 15px; font-weight: 600">travel-sync</span>
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #8A5A00; background: #FBEED8; padding: 3px 8px; border-radius: 20px">Draft</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <button type="button" style="font: inherit; font-size: 13px; font-weight: 600; color: #1F2430; background: #FFFFFF; border: 1px solid #D8D8D0; border-radius: 8px; padding: 8px 14px; cursor: pointer">Preview run</button>
      <button type="button" style="font: inherit; font-size: 13px; font-weight: 600; color: #FFFFFF; background: {{accent}}; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer">Save workflow</button>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; display: flex">

    <div style="width: 240px; flex: none; box-sizing: border-box; padding: 18px 14px; background: #F8F8F5; border-right: 1px solid #E3E3DD; display: flex; flex-direction: column; gap: 8px; overflow-y: auto">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8A8A80">Steps</span>
        <button type="button" aria-label="Add step" style="width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #D8D8D0; border-radius: 6px; color: #4A4A42; cursor: pointer">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        </button>
      </div>

      <button type="button" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; padding: 9px 10px; background: #FFFFFF; border: 1px solid #E3E3DD; border-radius: 8px; font: inherit; cursor: pointer">
        <span style="display: flex; align-items: center; gap: 8px; min-width: 0">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#8A8A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L4 14h7l-1 7 9-11h-7l1-7z"></path></svg>
          <span style="font-size: 13px; color: #4A4A42; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">New email</span>
        </span>
        <span style="font-size: 10px; font-weight: 600; color: #6B6B63; background: #EDEDE8; border-radius: 4px; padding: 2px 6px; flex: none">trigger</span>
      </button>

      <button type="button" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; padding: 9px 10px; background: #FFFFFF; border: 1px solid #E3E3DD; border-radius: 8px; font: inherit; cursor: pointer">
        <span style="display: flex; align-items: center; gap: 8px; min-width: 0">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#8A8A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
          <span style="font-size: 13px; color: #4A4A42; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Read email</span>
        </span>
        <span style="font-size: 10px; font-weight: 600; color: #6B6B63; background: #EDEDE8; border-radius: 4px; padding: 2px 6px; flex: none">linear</span>
      </button>

      <button type="button" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; padding: 9px 10px; background: #FFFFFF; border: 1px solid #E3E3DD; border-radius: 8px; font: inherit; cursor: pointer">
        <span style="display: flex; align-items: center; gap: 8px; min-width: 0">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#8A8A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"></path><path d="M9 12l2 2 4-4"></path></svg>
          <span style="font-size: 13px; color: #4A4A42; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Verify booking</span>
        </span>
        <span style="font-size: 10px; font-weight: 600; color: #8A5A00; background: #FBEED8; border-radius: 4px; padding: 2px 6px; flex: none">branch</span>
      </button>

      <button type="button" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; padding: 9px 10px; background: #FFFFFF; border: 1px solid #E3E3DD; border-radius: 8px; font: inherit; cursor: pointer">
        <span style="display: flex; align-items: center; gap: 8px; min-width: 0">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#8A8A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>
          <span style="font-size: 13px; color: #4A4A42; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Add to calendar</span>
        </span>
        <span style="font-size: 10px; font-weight: 600; color: #6B6B63; background: #EDEDE8; border-radius: 4px; padding: 2px 6px; flex: none">linear</span>
      </button>

      <button type="button" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; padding: 9px 10px; background: #EFEAFB; border: 1.5px solid #6E56CF; border-radius: 8px; font: inherit; cursor: pointer">
        <span style="display: flex; align-items: center; gap: 8px; min-width: 0">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="#6E56CF" stroke="none"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8L12 2z"></path></svg>
          <span style="font-size: 13px; font-weight: 600; color: #1F2430; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Resolve exception</span>
        </span>
        <span style="font-size: 10px; font-weight: 600; color: #5B3FA8; background: #EFEAFB; border-radius: 4px; padding: 2px 6px; flex: none">free-form</span>
      </button>

      <button type="button" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; padding: 9px 10px; background: #FFFFFF; border: 1px solid #E3E3DD; border-radius: 8px; font: inherit; cursor: pointer">
        <span style="display: flex; align-items: center; gap: 8px; min-width: 0">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#8A8A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l4 4L21 4"></path><path d="M3 19h18"></path></svg>
          <span style="font-size: 13px; color: #4A4A42; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Notify user</span>
        </span>
        <span style="font-size: 10px; font-weight: 600; color: #6B6B63; background: #EDEDE8; border-radius: 4px; padding: 2px 6px; flex: none">linear</span>
      </button>
    </div>

    <div style="flex: 1; min-width: 0; box-sizing: border-box; padding: 26px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; overflow: auto">

      <div style="width: 140px; box-sizing: border-box; padding: 10px 8px; background: #FFFFFF; border: 1px solid #E3E3DD; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; opacity: 0.75">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#8A8A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L4 14h7l-1 7 9-11h-7l1-7z"></path></svg>
        <span style="font-size: 11px; font-weight: 600; color: #4A4A42">New email</span>
      </div>
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#B7B7AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M19 12l-7 7-7-7"></path></svg>

      <div style="width: 200px; box-sizing: border-box; padding: 14px 12px; background: #FFFFFF; border: 1px solid #E3E3DD; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8A8A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
        <span style="font-size: 13px; font-weight: 700; color: #1F2430">Read email</span>
        <span style="font-size: 11px; color: #8A8A80">Gmail MCP</span>
      </div>
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#B7B7AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M19 12l-7 7-7-7"></path></svg>

      <div style="width: 200px; box-sizing: border-box; padding: 14px 12px; background: #FFFFFF; border: 1px solid #E3E3DD; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8A8A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"></path><path d="M9 12l2 2 4-4"></path></svg>
        <span style="font-size: 13px; font-weight: 700; color: #1F2430">Verify booking</span>
        <span style="font-size: 11px; color: #8A8A80">Match against rules</span>
      </div>
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#B7B7AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M19 12l-7 7-7-7"></path></svg>

      <div style="display: flex; align-items: flex-start; gap: 48px; padding-top: 2px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="font-size: 11px; font-weight: 600; color: #0F6E56">verified</span>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#B7B7AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M19 12l-7 7-7-7"></path></svg>
          <div style="width: 160px; box-sizing: border-box; padding: 12px 10px; background: #E1F5EE; border: 1px solid #5DCAA5; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
            <span style="font-size: 12px; font-weight: 700; color: #085041">Add to calendar</span>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="font-size: 11px; font-weight: 600; color: #993C1D">flagged</span>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#B7B7AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M19 12l-7 7-7-7"></path></svg>
          <div style="width: 160px; box-sizing: border-box; padding: 12px 10px; background: #EFEAFB; border: 2px solid #6E56CF; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; box-shadow: 0 4px 14px rgba(110,86,207,0.14)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="#6E56CF" stroke="none"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8L12 2z"></path></svg>
            <span style="font-size: 13px; font-weight: 700; color: #1F2430">Resolve exception</span>
          </div>
          <svg viewBox="0 0 24 32" width="14" height="19" fill="none" stroke="#6E56CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v18" stroke-dasharray="3 3"></path><path d="M6 20l6 7 6-7"></path></svg>
          <div style="display: flex; gap: 10px">
            <div style="width: 96px; box-sizing: border-box; padding: 8px 6px; background: #FFFFFF; border: 1px dashed #6E56CF; border-radius: 8px; text-align: center">
              <span style="font-size: 11px; font-weight: 600; color: #5B3FA8">Notify user</span>
            </div>
            <div style="width: 96px; box-sizing: border-box; padding: 8px 6px; background: #FFFFFF; border: 1px dashed #6E56CF; border-radius: 8px; text-align: center">
              <span style="font-size: 11px; font-weight: 600; color: #5B3FA8">Retry verify</span>
            </div>
          </div>
          <span style="font-size: 10px; color: #5B3FA8; font-weight: 600">agent picks one</span>
        </div>
      </div>

    </div>

    <div style="width: 392px; flex: none; box-sizing: border-box; padding: 22px 22px 20px 22px; background: #FFFFFF; border-left: 1px solid #E3E3DD; display: flex; flex-direction: column; gap: 16px; overflow-y: auto">

      <div>
        <label for="stepname3" style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8A8A80; margin-bottom: 6px">Configure step</label>
        <input id="stepname3" type="text" value="Resolve exception" style="width: 100%; box-sizing: border-box; font: inherit; font-size: 17px; font-weight: 700; color: #1F2430; padding: 6px 0; border: none; border-bottom: 1px solid transparent; background: transparent">
      </div>

      <div>
        <span style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8A8A80; margin-bottom: 6px">Step type</span>
        <div style="display: flex; gap: 6px">
          <button type="button" style="flex: 1; font: inherit; font-size: 12px; font-weight: 600; padding: 7px 0; border-radius: 6px; cursor: pointer; border: 1px solid #E3E3DD; background: #FFFFFF; color: #8A8A80">Linear</button>
          <button type="button" style="flex: 1; font: inherit; font-size: 12px; font-weight: 600; padding: 7px 0; border-radius: 6px; cursor: pointer; border: 1px solid #E3E3DD; background: #FFFFFF; color: #8A8A80">Branch</button>
          <button type="button" style="flex: 1; font: inherit; font-size: 12px; font-weight: 600; padding: 7px 0; border-radius: 6px; cursor: pointer; border: 1.5px solid #6E56CF; background: #EFEAFB; color: #5B3FA8">Free-form</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid #EDEDE8">
        <span style="font-size: 12px; font-weight: 600; color: #4A4A42">Inputs from previous step</span>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <span style="font-size: 11px; font-family: monospace; color: #4A4A42; background: #F1F1EE; border: 1px solid #E3E3DD; border-radius: 20px; padding: 4px 10px">sender</span>
          <span style="font-size: 11px; font-family: monospace; color: #4A4A42; background: #F1F1EE; border: 1px solid #E3E3DD; border-radius: 20px; padding: 4px 10px">booking_reference</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid #EDEDE8">
        <label for="goalbox" style="font-size: 12px; font-weight: 600; color: #4A4A42">Goal</label>
        <textarea id="goalbox" rows="3" style="width: 100%; box-sizing: border-box; font: inherit; font-size: 12.5px; line-height: 1.5; color: #1F2430; padding: 10px 12px; border: 1px solid #E3E3DD; border-radius: 8px; background: #FCFCFA; resize: none">Resolve the flagged booking: ask the user for clarification, retry verification with updated info, or escalate — whichever fits the situation.</textarea>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid #EDEDE8">
        <span style="font-size: 12px; font-weight: 600; color: #4A4A42">Steps this agent can use</span>

        <label style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #FCFCFA; border: 1px solid #E3E3DD; border-radius: 8px; cursor: pointer">
          <input type="checkbox" checked="checked" style="flex: none">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#8A8A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l4 4L21 4"></path><path d="M3 19h18"></path></svg>
          <span style="font-size: 12.5px; color: #1F2430">Notify user</span>
        </label>

        <label style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #FCFCFA; border: 1px solid #E3E3DD; border-radius: 8px; cursor: pointer">
          <input type="checkbox" checked="checked" style="flex: none">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#8A8A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"></path><path d="M9 12l2 2 4-4"></path></svg>
          <span style="font-size: 12.5px; color: #1F2430">Verify booking</span>
        </label>

        <label style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #FCFCFA; border: 1px solid #E3E3DD; border-radius: 8px; cursor: pointer; opacity: 0.55">
          <input type="checkbox" style="flex: none">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#8A8A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>
          <span style="font-size: 12.5px; color: #1F2430">Add to calendar</span>
        </label>
      </div>

      <div style="display: flex; align-items: center; gap: 10px">
        <label for="maxsteps" style="font-size: 12px; font-weight: 600; color: #4A4A42; flex: 1">Max steps before escalating</label>
        <input id="maxsteps" type="number" value="3" style="width: 56px; text-align: center; font: inherit; font-size: 12.5px; padding: 6px 4px; border: 1px solid #E3E3DD; border-radius: 6px; background: #FCFCFA">
      </div>

      <div style="margin-top: auto; display: flex; gap: 10px">
        <button type="button" style="flex: 1; font: inherit; font-size: 13px; font-weight: 600; color: #1F2430; background: #FFFFFF; border: 1px solid #D8D8D0; border-radius: 8px; padding: 9px 0; cursor: pointer">Run test</button>
        <button type="button" style="flex: 1; font: inherit; font-size: 13px; font-weight: 600; color: #FFFFFF; background: #6E56CF; border: none; border-radius: 8px; padding: 9px 0; cursor: pointer">Save step</button>
      </div>

    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5D9F"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2F5D9F' };
  }
}
</script>
</body>
</html>
